    body {
      font-family: 'Fredoka', sans-serif;
      background: radial-gradient(circle at 50% 20%, #064e3b, #022c22, #02110c);
      min-height: 100vh;
      color: #ecfdf5;
      user-select: none;
    }

    .molecule-font {
      font-family: 'JetBrains Mono', monospace;
    }

    @keyframes gentleFloat {

      50% { transform: translateY(-5px) rotate(1.2deg); }
    }
    .cute-cat-anim {
      animation: gentleFloat 3s ease-in-out infinite;

    // ===============================================================
    // LOGIQUE DE L'APP
    // ===============================================================
    let screen = 'menu_chapitres';
    let currentChapterIdx = 0;
    let fileQuestions = [];
    let questionEnCours = null;
    let totalQuestionsInitial = 0;
    let questionsReussiesCompteur = 0;

    const container = document.getElementById('appContainer');
    const croquettesDisplay = document.getElementById('croquettesDisplay');
    const btnHome = document.getElementById('btnNavigationHome');

    btnHome.addEventListener('click', () => {
      screen = 'menu_chapitres';
      render();
    });

    function updateCroquettes(valeur) {
      croquettes += valeur;
      croquettesDisplay.innerText = `${croquettes} 🐟`;
      sauvegarder();
    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function render() {
      container.innerHTML = '';
      if (screen === 'menu_chapitres') renderMenu();
      else if (screen === 'shop') renderShop();
      else if (screen === 'session_niveau') renderQuestionActive();
      else if (screen === 'victoire') renderVictoire();
    }

    function renderMenu() {
      container.innerHTML = `

    function renderShop() {
      container.innerHTML = `

    window.acheterObjet = function(id, prix, type) {
      if (croquettes >= prix) {
        updateCroquettes(-prix);
        articlesAchetes.push(type + ':' + id);
        chatEquipement[type] = id;
        sauvegarder();
        render();
      } else {
        alert("Pas assez de croquettes ! Réussis un chapitre pour en accumuler 🐟");
      }
    };

    window.equiperObjet = function(type, id) {
      chatEquipement[type] = id;
      sauvegarder();
      render();
    };

    window.demarrerNiveauUnique = function(chapIdx = 0) {
      currentChapterIdx = chapIdx;
      const chapitreChoisi = TOUS_LES_CHAPITRES[currentChapterIdx];
      
      if (!chapitreChoisi.quizFinal || chapitreChoisi.quizFinal.length === 0) {
        alert("Ce chapitre ne contient pas encore de questions ! Ajoute des questions dans son tableau quizFinal pour y jouer.");
        return;
      }

      fileQuestions = shuffle([...chapitreChoisi.quizFinal]);
      totalQuestionsInitial = fileQuestions.length;
      questionsReussiesCompteur = 0;
      screen = 'session_niveau';
      prochaineQuestionDeLaFile();
    };

    function prochaineQuestionDeLaFile() {
      if (fileQuestions.length > 0) {
        questionEnCours = fileQuestions.shift();
        render();
      } else {
        screen = 'victoire';
        render();
      }
    }

    function renderQuestionActive() {
      const q = questionEnCours;
      const restantes = fileQuestions.length + 1;
      const pourcentage = Math.min(100, Math.round((questionsReussiesCompteur / totalQuestionsInitial) * 100));

      container.innerHTML = `
        <div>
          <div class="flex justify-between items-center text-xs mb-2">
            <span class="font-bold text-emerald-300">
              <i class="fa-solid fa-atom mr-1 text-cyan-400"></i> ${q.badge || 'Exercice'}
            </span>
            <div class="flex items-center gap-1.5 bg-emerald-950/80 px-3 py-1 rounded-full border border-emerald-500/30 text-xs shadow-inner">
              <span class="text-slate-400">Reste :</span>
              <span class="font-extrabold text-amber-300">${restantes}</span>
              <span class="text-slate-500 text-[10px]">/ ${totalQuestionsInitial}</span>
            </div>
          </div>

          <div class="w-full bg-slate-800/90 rounded-full h-2.5 mb-2.5 border border-slate-700/60 overflow-hidden">
            <div class="bg-gradient-to-r from-emerald-500 to-cyan-400 h-2.5 rounded-full transition-all duration-300 shadow-[0_0_10px_rgba(16,185,129,0.5)]" 
                 style="width: ${pourcentage}%">
            </div>
          </div>

          <div class="flex justify-between text-[11px] text-slate-400 px-1 mb-2">
            <span>Validées : <b class="text-emerald-400">${questionsReussiesCompteur}</b></span>
            <span>Progression : <b class="text-cyan-300">${pourcentage}%</b></span>
          </div>

          <div class="bg-slate-950 border-2 border-emerald-500/40 rounded-2xl p-3.5 flex flex-col items-center justify-center my-2 min-h-[105px] shadow-inner">
            <pre class="molecule-font text-xs sm:text-sm text-emerald-300 font-extrabold tracking-wide leading-relaxed text-center whitespace-pre-wrap">${q.molecule}</pre>
          </div>

          <p class="text-xs text-slate-100 font-semibold text-center my-2 leading-snug">${q.question}</p>
        </div>

        <div class="grid grid-cols-1 gap-2 my-auto" id="optionsBox">
          ${q.options.map((opt, i) => `
            <button onclick="validerReponseNiveau(${i})" class="w-full text-left p-3 rounded-xl border border-slate-700 bg-slate-800/80 hover:border-emerald-400 hover:bg-emerald-950/40 text-slate-200 text-xs font-semibold transition">
              ${opt}
            </button>
          `).join('')}
        </div>

        <div id="feedbackBox" class="min-h-[55px] flex items-center justify-center mt-2"></div>
      `;
    }

    window.validerReponseNiveau = function(choixIndex) {
      const q = questionEnCours;
      const box = document.getElementById('feedbackBox');
      const boutons = document.getElementById('optionsBox').children;

      for (let btn of boutons) btn.disabled = true;

      if (choixIndex === q.reponseIndex) {
        boutons[choixIndex].classList.remove('bg-slate-800/80', 'border-slate-700');
        boutons[choixIndex].classList.add('bg-emerald-600', 'border-emerald-400', 'text-white');
        
        questionsReussiesCompteur++;
        updateCroquettes(q.gainCroquettes || 25);

        box.innerHTML = `
          <div class="text-center w-full">
            <p class="text-emerald-400 text-xs font-bold mb-1.5">✨ Validé ! (+${q.gainCroquettes || 25} 🐟)</p>
            <button onclick="prochaineQuestionDeLaFile()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2 rounded-xl text-white text-xs font-bold">
              Continuer
            </button>
          </div>
        `;
      } else {
        boutons[choixIndex].classList.remove('bg-slate-800/80', 'border-slate-700');
        boutons[choixIndex].classList.add('bg-rose-600', 'border-rose-400', 'text-white');

        fileQuestions.push(q);

        box.innerHTML = `
          <div class="text-center w-full">
            <p class="text-rose-400 text-[11px] font-medium mb-1 leading-tight">${q.explication}</p>
            <div class="text-amber-300 text-[10px] font-bold mb-2">🔁 Cette question reviendra plus tard !</div>
            <button onclick="prochaineQuestionDeLaFile()" class="w-full bg-slate-700 hover:bg-slate-600 py-1.5 rounded-xl text-white text-xs font-bold">
              Passer à la suite
            </button>
          </div>
        `;
      }
    };

    function renderVictoire() {
      container.innerHTML = `
        <div class="text-center my-auto">
          ${getCuteCatSvg("w-32 h-32")}
          <h3 class="text-lg font-black text-white mt-2">Chapitre Réussi à 100% !</h3>
          <p class="text-xs text-emerald-300 mt-0.5">Toutes les questions ont été validées.</p>
          
          <div class="bg-slate-800/80 border border-emerald-500/40 rounded-2xl p-4 my-3 text-center">
            <div class="text-3xl font-extrabold text-amber-300">+100 Croquettes 🐟</div>
            <p class="text-[11px] text-slate-300 mt-1">Félicitations pour votre persévérance !</p>
          </div>

          <div class="space-y-2">
            <button onclick="screen='shop'; render();" class="w-full bg-pink-600 hover:bg-pink-500 text-white font-bold py-2.5 rounded-xl text-xs transition">
              🛍️ Aller au dressing du chat
            </button>
            <button onclick="demarrerNiveauUnique(${currentChapterIdx})" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs transition">
              <i class="fa-solid fa-rotate-right mr-1"></i> Recommencer ce chapitre
            </button>
            <button onclick="screen='menu_chapitres'; render();" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-xl text-xs transition">
              Menu principal
            </button>
          </div>
        </div>
      `;
      updateCroquettes(100);
    }

    // Affiche le solde sauvegardé au démarrage
    croquettesDisplay.innerText = `${croquettes} 🐟`;
    render();
  </script>
</body>
</html>
